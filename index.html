<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agrowtein Live Vision</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3faf5;color:#173c2a}.app{max-width:1100px;margin:auto;padding:26px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.head h1{margin:0;color:#08764f}.badge{background:#e1f7e9;color:#08764f;padding:9px 13px;border-radius:99px;font-weight:bold}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:20px}.panel{background:#fff;border:1px solid #d8eddf;border-radius:22px;padding:20px;box-shadow:0 8px 30px #1231}.camera{width:100%;aspect-ratio:4/3;object-fit:cover;background:#193e2c;border-radius:15px}.label{font-size:31px;line-height:1.15;font-weight:800;color:#08764f;margin:15px 0}.confidence{font-size:21px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.stat{padding:15px;background:#f1fbf4;border-radius:14px}.stat b{display:block;font-size:22px;margin-top:5px}.muted{color:#68776e}.offline{color:#aa3a26}.online{color:#08764f}@media(max-width:720px){.grid{grid-template-columns:1fr}.app{padding:14px}.label{font-size:27px}}</style></head>
<body><main class="app"><header class="head"><div><h1>Agrowtein AI Vision</h1><div class="muted">Live mushroom condition monitoring</div></div><div id="status" class="badge offline">Camera connecting</div></header>
<section class="grid"><div class="panel"><img id="camera" class="camera" alt="Live Pi camera feed"><div class="muted" style="margin-top:10px">Live camera frame from Raspberry Pi</div></div><aside class="panel"><div class="muted">CURRENTLY SHOWN</div><div id="label" class="label">Waiting for camera</div><div id="confidence" class="confidence">Confidence: —</div><div class="stats"><div class="stat"><span class="muted">Camera FPS</span><b id="fps">—</b></div><div class="stat"><span class="muted">Last update</span><b id="updated">—</b></div></div></aside></section></main>
<script>const el=id=>document.getElementById(id);let last='';async function refresh(){try{const d=await fetch('/api/live',{cache:'no-store'}).then(r=>r.json());el('label').textContent=d.label;el('confidence').textContent=`Confidence: ${d.confidence.toFixed(1)}%`;el('fps').textContent=d.fps.toFixed(1);el('updated').textContent=d.updated_at?new Date(d.updated_at).toLocaleTimeString():'—';el('status').textContent=d.has_frame?'Camera live':'Waiting for camera';el('status').className='badge '+(d.has_frame?'online':'offline');if(d.has_frame){const src='/api/frame.jpg?t='+Date.now();if(src!==last){el('camera').src=src;last=src}}}catch{el('status').textContent='Dashboard disconnected';el('status').className='badge offline'}}refresh();setInterval(refresh,300)</script></body></html>
